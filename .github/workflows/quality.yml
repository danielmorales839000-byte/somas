name: SOMAS v2 quality
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
  # A real browser runner is opt-in and needs a deployed project URL.
  browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test tests/customer-browser.spec.js
        env:
          TEST_SITE_URL: ${{ secrets.SOMAS_TEST_SITE_URL }}
